---
- name: Install Jenkins host packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - docker.io
      - docker-compose-v2
      - git
      - jq
      - unzip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Add administrator to Docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups:
      - docker
    append: true

- name: Manage Caddy configuration
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ jenkins_caddyfile_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Apply Jenkins stack

- name: Manage Jenkins Compose configuration
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ jenkins_compose_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Apply Jenkins stack

- name: Flush configuration handlers
  ansible.builtin.meta: flush_handlers

- name: Get running Jenkins services
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ jenkins_compose_path }}"
      - ps
      - --status
      - running
      - --services
  register: jenkins_running_services
  changed_when: false
  when: not ansible_check_mode

- name: Verify Jenkins services are running
  ansible.builtin.assert:
    that:
      - "'controller' in jenkins_running_services.stdout_lines"
      - "'caddy' in jenkins_running_services.stdout_lines"
    fail_msg: Jenkins controller or Caddy is not running
    success_msg: Jenkins controller and Caddy are running
  when: not ansible_check_mode
